[package]
name = "tessera-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "openTessera desktop video wall"

[[bin]]
name = "tessera"
path = "src/main.rs"

[dependencies]
tessera-mpv = { workspace = true }
tessera-core = { workspace = true }
libloading = { workspace = true }
winit = { workspace = true }
glutin = { workspace = true }
glutin-winit = { workspace = true }
glow = { workspace = true }
egui = { workspace = true }
egui_glow = { workspace = true }
ureq = { workspace = true }
serde_json = { workspace = true }
libc = { workspace = true }
image = { version = "0.24", default-features = false, features = ["jpeg", "png"] }
png = "0.17"
base64 = "0.22"
raw-window-handle = { workspace = true }

# Cocoa calls winit 0.29 doesn't wrap (Finder open events, menu bar/Dock
# state). Pinned to the version winit itself uses, so it adds nothing to
# the build.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.4.1"

# Xlib calls winit 0.29 doesn't wrap (retyping a window to float it; see
# platform::set_floating). The version winit itself uses, so again nothing
# new is built, and it drives winit's own Display connection.
[target.'cfg(not(target_os = "macos"))'.dependencies]
x11-dl = "2.21"
