[workspace]
resolver = "2"
members = [
    "crates/tessera-mpv",
    "crates/tessera-core",
    "crates/tessera-app",
]

[workspace.package]
version = "0.2.1"
edition = "2021"
# Checked in CI (the msrv job); bump the two together.
rust-version = "1.90"
license = "GPL-3.0-or-later"
repository = "https://github.com/rabbitHoleSolutions/openTessera"

[workspace.dependencies]
libloading = "0.8"
winit = "0.29"
glutin = "0.31"
glutin-winit = "0.4"
glow = "0.13"
egui = "0.27"
# "clipboard" is not optional in practice: without it egui-winit falls back
# to an in-app clipboard, so Ctrl+V returns whatever was last copied *inside*
# Tessera and the system clipboard is never consulted. Pasting a camera URL
# from a browser silently produced an unrelated string.
egui_glow = { version = "0.27", features = ["winit", "clipboard"] }
raw-window-handle = "0.5"
ureq = { version = "2", features = ["json"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tessera-mpv = { path = "crates/tessera-mpv" }
tessera-core = { path = "crates/tessera-core" }

[profile.release]
lto = "thin"
