name: release

# A tag `vX.Y.Z` builds the macOS DMG and attaches it to a *draft* GitHub
# Release, to be looked over and published by hand. Run from the Actions
# tab instead (workflow_dispatch), it builds the same DMG as a downloadable
# artifact and releases nothing — for trying a build on a Mac first.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    # Apple Silicon. The bundled Homebrew libraries set the oldest macOS
    # the DMG runs on (build-app.sh writes it into Info.plist), and that is
    # the runner's: macos-latest (26) made a DMG Sequoia refused. Move this
    # on when GitHub retires the image, and the oldest supported Mac with it.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2

      # The app's version comes from Cargo.toml; a tag that disagrees would
      # ship a DMG whose About box contradicts its file name.
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v="$(awk -F'"' '/^\[workspace.package\]/ {p=1} p && /^version/ {print $2; exit}' Cargo.toml)"
          [ "$GITHUB_REF_NAME" = "v$v" ] || { echo "tag $GITHUB_REF_NAME, but Cargo.toml says $v"; exit 1; }

      - run: brew install mpv
      - run: cargo build --release --locked
      - run: ./packaging/macos/build-app.sh --no-build --dmg

      # The point of the DMG is a Mac without Homebrew, so hide Homebrew and
      # load libmpv the way the app does. --version loads it for real and
      # says which copy it got.
      - name: Smoke test without Homebrew
        # The system bash: the default `bash` may be Homebrew's own.
        shell: /bin/bash -e {0}
        run: |
          sudo mv /opt/homebrew /opt/homebrew.hidden
          out="$(target/Tessera.app/Contents/MacOS/tessera --version)" || status=$?
          sudo mv /opt/homebrew.hidden /opt/homebrew
          echo "$out"
          [ -z "${status:-}" ] || exit "$status"
          echo "$out" | grep -q 'from @executable_path/../Frameworks/' || { echo "did not load the bundled libmpv"; exit 1; }

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: tessera-macos
          path: target/Tessera-*.dmg

      - name: Draft a release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" target/Tessera-*.dmg --draft \
            --title "openTessera ${GITHUB_REF_NAME#v}" --notes-file .github/release-notes.md
